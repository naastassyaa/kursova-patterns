<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон з градієнтом -->
  <rect width="100" height="100" rx="22" fill="url(#grad1)"/>
  
  <!-- Спортивний символ - стилізований м'яч/кільце -->
  <circle cx="50" cy="50" r="30" fill="white" opacity="0.95"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#3b82f6" stroke-width="3"/>
  
  <!-- Буква S в центрі -->
  <text x="50" y="62" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#2563eb" text-anchor="middle">S</text>
  
  <!-- Декоративні лінії -->
  <line x1="20" y1="50" x2="30" y2="50" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="50" x2="80" y2="50" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
